<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<title>Untitled Music Game</title>
</head>

<body>

<!-- MODE SLIDER -->
<div class="mode-toggle" onclick="window.location.href='/'">
  <div class="toggle-slider year"></div>
  <span>Normal</span>
  <span>Year</span>
</div>

<!-- CATEGORY SELECTOR -->
<div class="category-dropdown">
  <button id="categoryBtn">Select Categories ▼</button>
  <div id="categoryList" class="dropdown-content"></div>
</div>

<div class="container">

<h1>Untitled Music Game</h1>

<div id="reader"></div>

<div class="row">
  <button id="reveal" style="display:none;">Reveal</button>
  <button id="nextSong" style="display:none;">Next Song</button>
</div>

<h2 id="info"></h2>

</div>

<script src="https://sdk.scdn.co/spotify-player.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<script>
const token = localStorage.getItem("spotify_token");
if(!token) window.location.href="/";

const revealBtn = document.getElementById("reveal");
const nextBtn = document.getElementById("nextSong");
const info = document.getElementById("info");
const categoryBtn = document.getElementById("categoryBtn");
const categoryList = document.getElementById("categoryList");
const dropdown = document.querySelector(".category-dropdown");

let player, deviceId, currentSong, stopTimer, qrScanner;

/* ================= CATEGORIES ================= */

async function loadCategories(){
  const res = await fetch("/categories");
  const cats = await res.json();
  categoryList.innerHTML = cats.map(c=>`
    <label class="cat-option">
      <input type="checkbox" value="${c.id}" checked>
      ${c.name} (${c.count})
    </label>
  `).join("");
}

function getCheckedCategories(){
  return [...document.querySelectorAll("#categoryList input:checked")]
    .map(x=>x.value).join(",");
}

categoryBtn.onclick=()=>dropdown.classList.toggle("show");
document.addEventListener("click",(e)=>{
  if(!dropdown.contains(e.target)) dropdown.classList.remove("show");
});
loadCategories();

/* ================= SPOTIFY ================= */

window.onSpotifyWebPlaybackSDKReady=()=>{
  player=new Spotify.Player({
    name:"Year Mode Player",
    getOAuthToken:cb=>cb(token)
  });

  player.addListener("ready", async({device_id})=>{
    deviceId=device_id;
    await fetch("https://api.spotify.com/v1/me/player",{
      method:"PUT",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+token
      },
      body:JSON.stringify({device_ids:[device_id],play:false})
    });
  });

  player.connect();
};

/* ================= AUTO STOP TIMER ================= */

function startTimer(){
  clearTimeout(stopTimer);
  stopTimer=setTimeout(async()=>{
    await fetch(`https://api.spotify.com/v1/me/player/pause?device_id=${deviceId}`,{
      method:"PUT",
      headers:{Authorization:"Bearer "+token}
    });
  },30000);
}

/* ================= SCAN + AUTO PLAY ================= */

function startScanner(){

  qrScanner=new Html5Qrcode("reader");

  qrScanner.start(
    {facingMode:"environment"},
    {fps:10,qrbox:250},
    async(decodedText)=>{

      const year=decodedText.trim();
      await qrScanner.stop();

      const cats=getCheckedCategories();
      const res=await fetch(`/random-song-year?year=${year}&cats=${cats}`);

      if(!res.ok){
        info.innerText="No songs found.";
        return;
      }

      currentSong=await res.json();

      await fetch(
        `https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`,
        {
          method:"PUT",
          headers:{
            "Content-Type":"application/json",
            "Authorization":"Bearer "+token
          },
          body:JSON.stringify({
            uris:[currentSong.spotify_uri],
            position_ms:30000
          })
        }
      );

      startTimer();

      revealBtn.style.display="inline-block";
      nextBtn.style.display="inline-block";
      info.innerText="Guess the year!";
    },
    error=>{}
  );
}

startScanner();

/* ================= REVEAL ================= */

revealBtn.onclick=()=>{
  if(!currentSong) return;
  info.innerHTML=`
    ${currentSong.title} — ${currentSong.artist}<br>
    Year: ${currentSong.year}
  `;
};

/* ================= NEXT SONG ================= */

nextBtn.onclick=async()=>{

  clearTimeout(stopTimer);

  await fetch(
    `https://api.spotify.com/v1/me/player/pause?device_id=${deviceId}`,
    {method:"PUT",headers:{Authorization:"Bearer "+token}}
  );

  revealBtn.style.display="none";
  nextBtn.style.display="none";
  info.innerText="";

  startScanner();
};
</script>

</body>
</html>
