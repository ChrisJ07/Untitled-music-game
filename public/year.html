<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<title>Year Mode</title>

<style>
body{
  font-family: 'Montserrat', sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: linear-gradient(135deg,#1DB954,#191414);
  color:white;
}

.container{
  text-align:center;
  background:rgba(0,0,0,0.6);
  padding:40px;
  border-radius:20px;
  width:90%;
  max-width:500px;
  backdrop-filter: blur(10px);
}

button{
  background:white;
  color:#191414;
  border:none;
  padding:12px 22px;
  font-size:16px;
  margin:8px;
  border-radius:40px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  transform:scale(1.05);
}

#reader{
  width:100%;
  max-width:300px;
  margin:20px auto;
}
</style>
</head>

<body>

<div class="container">

<h1 id="title">Year Mode</h1>

<div id="reader"></div>
<button id="scanBtn">Scan QR</button>

<br>

<button id="play" style="display:none;">Play Song</button>
<button id="reveal" style="display:none;">Reveal</button>

<h2 id="info"></h2>

</div>

<script src="https://sdk.scdn.co/spotify-player.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<script>

/* =========================
   TOKEN
========================= */

const token = localStorage.getItem("spotify_token");

if(!token){
  window.location.href="/";
}

/* =========================
   ELEMENTS
========================= */

const title = document.getElementById("title");
const scanBtn = document.getElementById("scanBtn");
const playBtn = document.getElementById("play");
const revealBtn = document.getElementById("reveal");
const info = document.getElementById("info");

let player;
let deviceId;
let currentSong;
let selectedYear = null;

/* =========================
   SPOTIFY PLAYER
========================= */

window.onSpotifyWebPlaybackSDKReady = () => {

  player = new Spotify.Player({
    name: "Year Mode Player",
    getOAuthToken: cb => cb(token)
  });

  player.addListener("ready", async ({ device_id }) => {

    deviceId = device_id;

    await fetch("https://api.spotify.com/v1/me/player",{
      method:"PUT",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+token
      },
      body:JSON.stringify({
        device_ids:[device_id],
        play:false
      })
    });

  });

  player.connect();
};

/* =========================
   QR SCANNER
========================= */

scanBtn.onclick = () => {

  const qr = new Html5Qrcode("reader");

  qr.start(
    { facingMode:"environment" },
    { fps:10, qrbox:250 },
    async (decodedText) => {

      selectedYear = decodedText.trim();
      title.innerText = "Year " + selectedYear;

      await qr.stop();

      scanBtn.style.display="none";
      playBtn.style.display="inline-block";
    },
    error => {}
  );
};

/* =========================
   PLAY
========================= */

playBtn.onclick = async () => {

  if(!deviceId){
    alert("Player still loading");
    return;
  }

  const res = await fetch(`/random-song-year?year=${selectedYear}`);

  if(!res.ok){
    info.innerText="No song for this year.";
    return;
  }

  currentSong = await res.json();

  await fetch(
    `https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`,
    {
      method:"PUT",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+token
      },
      body:JSON.stringify({
        uris:[currentSong.spotify_uri]
      })
    }
  );

  info.innerText="Guess the year!";
  revealBtn.style.display="inline-block";
};

/* =========================
   REVEAL
========================= */

revealBtn.onclick = () => {

  if(!currentSong) return;

  info.innerHTML = `
    ${currentSong.title} — ${currentSong.artist}<br>
    Year: ${currentSong.year}
  `;
};

</script>

</body>
</html>
