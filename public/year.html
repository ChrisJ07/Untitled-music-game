<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<title>Year Mode</title>
</head>

<body>

<div class="category-dropdown">
  <button id="categoryBtn">Select Categories ▼</button>
  <div id="categoryList" class="dropdown-content"></div>
</div>

<div class="container">

<h1 id="title">Year Mode</h1>

<div id="reader"></div>

<div class="row">
  <button id="scanBtn">Scan QR</button>
  <button id="nextScanBtn" style="display:none;">Next Scan</button>
</div>

<div class="row">
  <button id="play" style="display:none;">Play</button>
  <button id="stopBtn" style="display:none;">Stop</button>
  <button id="reveal" style="display:none;">Reveal</button>
</div>

<div class="row">
  <button onclick="window.location.href='/'">Normal Mode</button>
</div>

<h2 id="info"></h2>

</div>

<script src="https://sdk.scdn.co/spotify-player.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<script>

/* =========================
   TOKEN
========================= */

const token = localStorage.getItem("spotify_token");
if(!token) window.location.href="/";

/* =========================
   ELEMENTS
========================= */

const title = document.getElementById("title");
const scanBtn = document.getElementById("scanBtn");
const nextScanBtn = document.getElementById("nextScanBtn");
const playBtn = document.getElementById("play");
const stopBtn = document.getElementById("stopBtn");
const revealBtn = document.getElementById("reveal");
const info = document.getElementById("info");
const categoryBtn = document.getElementById("categoryBtn");
const categoryList = document.getElementById("categoryList");
const dropdown = document.querySelector(".category-dropdown");

let player;
let deviceId;
let currentSong;
let selectedYear = null;
let stopTimer = null;
let qrScanner;

/* =========================
   LOAD CATEGORIES
========================= */

async function loadCategories(){
  const res = await fetch("/categories");
  const cats = await res.json();

  categoryList.innerHTML = cats.map(c => `
    <label class="cat-option">
      <input type="checkbox" value="${c.id}" checked>
      ${c.name} (${c.count})
    </label>
  `).join("");
}

function getCheckedCategories(){
  return [...document.querySelectorAll("#categoryList input:checked")]
    .map(x => x.value)
    .join(",");
}

categoryBtn.onclick = () => {
  dropdown.classList.toggle("show");
};

document.addEventListener("click",(e)=>{
  if(!dropdown.contains(e.target)){
    dropdown.classList.remove("show");
  }
});

loadCategories();

/* =========================
   SPOTIFY PLAYER
========================= */

window.onSpotifyWebPlaybackSDKReady = () => {

  player = new Spotify.Player({
    name:"Year Mode Player",
    getOAuthToken:cb=>cb(token)
  });

  player.addListener("ready", async ({device_id})=>{
    deviceId=device_id;

    await fetch("https://api.spotify.com/v1/me/player",{
      method:"PUT",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+token
      },
      body:JSON.stringify({
        device_ids:[device_id],
        play:false
      })
    });
  });

  player.connect();
};

/* =========================
   QR SCAN
========================= */

function startScanner(){

  qrScanner = new Html5Qrcode("reader");

  qrScanner.start(
    {facingMode:"environment"},
    {fps:10, qrbox:250},
    async (decodedText)=>{
      selectedYear = decodedText.trim();
      title.innerText = "Year " + selectedYear;

      await qrScanner.stop();

      scanBtn.style.display="none";
      nextScanBtn.style.display="inline-block";
      playBtn.style.display="inline-block";
    },
    error=>{}
  );
}

scanBtn.onclick = startScanner;

nextScanBtn.onclick = ()=>{
  info.innerText="";
  revealBtn.style.display="none";
  playBtn.style.display="none";
  startScanner();
};

/* =========================
   PLAY (30s FROM MIDDLE)
========================= */

function startTimer(){
  clearTimeout(stopTimer);
  stopTimer = setTimeout(async ()=>{
    await fetch(`https://api.spotify.com/v1/me/player/pause?device_id=${deviceId}`,{
      method:"PUT",
      headers:{ Authorization:"Bearer "+token }
    });
  },30000);
}

playBtn.onclick = async ()=>{

  if(!deviceId){
    alert("Player still loading");
    return;
  }

  const cats = getCheckedCategories();
  const res = await fetch(`/random-song-year?year=${selectedYear}&cats=${cats}`);

  if(!res.ok){
    info.innerText="No songs found.";
    return;
  }

  currentSong = await res.json();

  await fetch(
    `https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`,
    {
      method:"PUT",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+token
      },
      body:JSON.stringify({
        uris:[currentSong.spotify_uri],
        position_ms:30000   // 🔥 START FROM 30s
      })
    }
  );

  startTimer();

  info.innerText="Guess the year!";
  stopBtn.style.display="inline-block";
  revealBtn.style.display="inline-block";
};

/* =========================
   STOP
========================= */

stopBtn.onclick = async ()=>{
  clearTimeout(stopTimer);

  await fetch(
    `https://api.spotify.com/v1/me/player/pause?device_id=${deviceId}`,
    {
      method:"PUT",
      headers:{ Authorization:"Bearer "+token }
    }
  );

  info.innerText="Paused!";
};

/* =========================
   REVEAL
========================= */

revealBtn.onclick = ()=>{
  if(!currentSong) return;

  info.innerHTML = `
    ${currentSong.title} — ${currentSong.artist}<br>
    Year: ${currentSong.year}
  `;
};

</script>

</body>
</html>
